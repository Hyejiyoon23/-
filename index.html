<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咖喱狗</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff6ee; overflow: hidden; }
  .wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  canvas { max-width: 96vw; max-height: 96vh; display: block; }
</style>
</head>
<body>
<div class="wrap"><canvas id="cv" width="700" height="660"></canvas></div>

<script>
// ============ 像素画网格（34 列 × 29 行） ============
// 每个字符就是一个"像素块"：b=棕 w=白 r=红 d=深红 .=透明
// 注意：这里去掉了眼睛，只保留了眉毛、鼻子和下巴，眼睛由下方的 JS 动态绘制
const GRID = [
  "......................d...................",
  ".....................d....................",
  "....................d.....................",
  "..................dddd....................",
  ".................drdrrd...................",
  "................drrdrrrd..................",
  "................drrrrrrd..................",
  "..............ggdrrrrrrdg.................",
  ".............ggchdrrrrdhgg................",
  "............gcchhhddddhchhg...............",
  "...........gcchhccchcchcchhg..............",
  "........ggggghhhcchhcchhchggggg...........", // 奶油顶
  ".......gwwwwghhhgghhhchhggwwwwwg..........",
  "......gwwwwwwgggwwggggggwwwwwwwwg.........",
  ".....gwwwwwwwwwwwwwwwwwwwwwwwwwwwg........",
  "....gwwwwwwwwwwwwwwwwwwwwwwwwwwwwwg.......", // 头部融合
  "....gwwwwwwwggggwwwwwwwggggwwwwwwwg.......",
  "....gwwwwwwwwwwwwwwwwwwwwwwwwwwwwwg.......",
  "....gwwwwggwwggwwwwwwwwwggwwggwwwwg.......",
  ".....gwwgwwwgwwgwwwwwwwgwwgwwwgwwg........", // 19行：眉毛
  "......ggwwwwggggwwwwwwwggggwwwwgg.........",
  ".......gwwwwggggwwwwwwwggggwwwwg..........", // 21行：眼睛从此处开始生成
  ".......gwwwwggggwwwwwwwggggwwwwg..........",
  ".......gwwwwggggwwwwwwwggggwwwwg..........",
  ".......gwwwwwggwwwwgwwwwggwwwwwg..........",
  "........gwwwwwwwwwwwwwwwwwwwwwg...........", // 25行：眼睛结束
  ".........ggwwwwwwwwwwwwwwwwwgg............", // 26行：鼻子
  "...........ggggggggggggggggg..............",
];
const COLORS = { 
  w: '#FFFFFF', // H2
  g: '#775134', // G14
  c: '#F4EFE6', // H21
  h: '#E3D9C9', // H19
  r: '#EF3E4A', // F
  d: '#C1292E'  // F6
};

const PX = 20;                       // 每个像素格放大到 20px
const COLS = 43, ROWS = GRID.length;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const OX = (cv.width - COLS * PX) / 2+50;
const OY = (cv.height - ROWS * PX) / 2;

// 眼睛参数（加入了高光偏移量 offsetX）
// 眼睛参数（x和y是眼睛左上角的基准点）
const EYES = [
  { x: 12, y: 18 },   // 左眼基准坐标
  { x: 23, y: 18 }   // 右眼基准坐标
];
const BLINK_Y = 21; 

let nextBlink = 1500, blinkUntil = 0;

function loop(now) {
  if (now >= nextBlink) {
    blinkUntil = now + 150;                              // 闭眼 150 毫秒
    const dbl = Math.random() < 0.35;                    // 35% 概率连眨两下
    nextBlink = now + (dbl ? 380 : 2200 + Math.random() * 2200);
  }
  const closed = now < blinkUntil;
  const bob = Math.sin(now / 1000) * 8;                  // 呼吸浮动

  // 清空背景
  ctx.fillStyle = '#fff6ee';
  ctx.fillRect(0, 0, cv.width, cv.height);

  // 1. 绘制身体和轮廓（纯像素块）
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = GRID[r][c];
      if (ch === '.') continue;
      ctx.fillStyle = COLORS[ch];
      ctx.fillRect(OX + c * PX, OY + r * PX + bob, PX, PX);
    }
  }

  // 2. 动态绘制眼睛（只处理闭眼，睁眼直接靠GRID显示）
if (closed) {
  // 闭眼：直接用白色把刚才画的眼睛盖掉，然后用棕色画一条短横线
  ctx.fillStyle = COLORS.w;
  ctx.fillRect(OX + 12 * PX, OY + 18 * PX + bob, 4 * PX, 7 * PX); // 盖住左眼
  ctx.fillRect(OX + 23 * PX, OY + 18 * PX + bob, 4 * PX, 7 * PX); // 盖住右眼
  
  ctx.fillStyle = COLORS.g;
  // 画闭眼的横线
  ctx.fillRect(OX + 12 * PX, OY + 21 * PX + bob, 4 * PX, PX); 
  ctx.fillRect(OX + 23 * PX, OY + 21 * PX + bob, 4 * PX, PX); 
}
    
  

  requestAnimationFrame(loop);
  }
requestAnimationFrame(loop);
</script>
</body>
</html>
